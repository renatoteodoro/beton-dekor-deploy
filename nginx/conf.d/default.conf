server {
 listen 80;
 server_name betondekor.com.br www.betondekor.com.br;
 return 301 https://$host$request_uri;
}

server {
 listen 443 ssl;
 server_name betondekor.com.br www.betondekor.com.br;

 ssl_certificate /etc/letsencrypt/live/betondekor.com.br/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/betondekor.com.br/privkey.pem;

 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_ciphers HIGH:!aNULL:!MD5;



 location / {
 proxy_pass http://web:8000;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 }

 # ADICIONE ESTE BLOCO:
location = /favicon.ico {
    access_log off;
    log_not_found off;
    # Aponta para o caminho dentro do container do Nginx definido no docker-compose
    alias /etc/nginx/conf.d/static/favicon.ico; 
}

# Aproveite para configurar as pastas de estáticos e mídia no Nginx
location /static/ {
    alias /app/staticfiles/;
}

location /media/ {
     alias /app/media/;
}
}
